name: 사이트 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *" # 매시간: 새로 등록한 아이템의 페이지와 사이트맵을 다시 만들어요
  workflow_run:
    workflows: ["가격 자동 확인"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 아이템 페이지와 사이트맵 만들기
        run: node scripts/build-pages.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: sb_publishable_sgNoVED5UXmYv85QtPZSlA_L8XzIpay # 공개 키(누구나 볼 수 있는 데이터만 읽어요)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
