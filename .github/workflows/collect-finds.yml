name: 착장 정보 자동 수집

on:
  schedule:
    - cron: "7 22 * * *" # 매일 한국 시간 아침 7시 7분
  workflow_dispatch: # Actions 화면에서 직접 실행할 수도 있어요

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 깃허브 컴퓨터는 그래픽카드가 없어서 작은 모델을 써요.
      # 바꾸고 싶으면 저장소 Settings → Secrets and variables → Actions → Variables에 OLLAMA_MODEL을 만드세요.
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
    steps:
      - name: 네이버 키 확인
        id: chk
        run: |
          if [ -z "$NAVER_CLIENT_ID" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::네이버 검색 API 키(NAVER_CLIENT_ID)가 아직 없어서 이번에는 건너뛰어요."
          fi
      - uses: actions/checkout@v5
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-node@v5
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: 24
      - name: 올라마 설치하고 모델 받기
        if: steps.chk.outputs.skip != '1'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; (ollama serve >/dev/null 2>&1 &); sleep 2; done
          ollama pull "$OLLAMA_MODEL"
      - name: 글 읽고 후보를 제보함에 넣기
        if: steps.chk.outputs.skip != '1'
        run: node scripts/collect-finds.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          MAX_DOCS: 35
          TEXT_LIMIT: 2500
